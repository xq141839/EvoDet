# ==============================================================================
# EvoDet — Endoscapes inference configuration
# ------------------------------------------------------------------------------
# Model: EvoDet (S²-Align + C²-Detector) built on the DINOv3/ViT-Tiny
# backbone. The backbone / encoder / decoder blocks mirror the Endoscapes
# multi-class configuration; the EvoDet blocks add the three proposed modules.
#
#   num_classes = 6: Cystic Plate, Calot Triangle, Cystic Artery,
#                    Cystic Duct, Gallbladder, Tool
# ==============================================================================

task: detection

model: EvoDet
postprocessor: PostProcessor
use_focal_loss: True

num_classes: 6
remap_mscoco_category: False
eval_spatial_size: [640, 640]

EvoDet:
  backbone: EvoDetBackbone
  encoder: HybridEncoder
  decoder: C2Decoder
  s2align: S2Align

# ------------------------------------------------------------------------------
# Frozen Vision-Foundation-Model backbone (DINOv3 / ViT-Tiny, distilled from
# DINOv3-S). `finetune: False` keeps the VFM frozen for S²-Align.
# ------------------------------------------------------------------------------
EvoDetBackbone:
  name: vit_tiny_plus
  embed_dim: 256
  weights_path: ./ckpts/vittplus_distill.pt   # optional distill init; the full
  interaction_indexes: [3, 7, 11]             # checkpoint is loaded by load_evodet
  num_heads: 4
  finetune: False

# ------------------------------------------------------------------------------
# Multi-scale adapter: 1x1 conv channel alignment + transformer attention
# refinement + feature pyramid with path aggregation (Sec. III-C).
# ------------------------------------------------------------------------------
HybridEncoder:
  in_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  use_encoder_idx: [2]
  num_encoder_layers: 3
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: gelu
  expansion: 1.0
  depth_mult: 1.0
  act: silu
  version: deim
  csp_type: csp2
  fuse_op: sum
  eval_spatial_size: [640, 640]

# ------------------------------------------------------------------------------
# C²-Detector decoder: DEIM decoder + prototype-enhanced queries + learnable
# negative queries (complementary target-background confidence).
# ------------------------------------------------------------------------------
C2Decoder:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3
  num_layers: 3
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points: [3, 6, 3]
  cross_attn_method: default
  query_select_method: default
  activation: silu
  mlp_act: silu
  dim_feedforward: 1024
  eval_spatial_size: [640, 640]
  # ---- C²-Detector extensions ----
  prototype_dim: 256
  num_negative_queries: 64
  neg_nhead: 8

# ------------------------------------------------------------------------------
# S²-Align: spectral factorization + prototype-guided activation.
# ------------------------------------------------------------------------------
S2Align:
  num_classes: 6
  feature_dim: 256
  feature_index: 1          # stride-16 native patch embedding
  temperature: 0.1          # T
  activation_threshold: 0.5 # τ_a
  top_k: 8                  # retained SVD components

PostProcessor:
  num_top_queries: 300
